<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Halli Miller | Website editor</title><link rel="icon" href="assets/favicon.svg"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body>
<section id="login" class="login"><form id="login-form"><a class="wordmark" href="/">halli</a><p class="overline">YOUR SPACE, YOUR WEBSITE</p><h1>Welcome back, Halli.</h1><p>Sign in to update your photos, services, and everything in between.</p><label for="password">Password</label><input id="password" type="password" autocomplete="current-password" required><button class="primary" type="submit">Sign in →</button><p id="login-error" role="alert"></p><a class="back" href="/">← Back to the website</a></form></section>
<div id="editor" hidden><header class="toolbar"><a class="wordmark" href="/">halli<span>WEBSITE EDITOR</span></a><div class="toolbar-actions"><span id="save-status" role="status">All changes saved</span><a href="/" target="_blank" rel="noopener">View website ↗</a><button id="save" class="primary">Save changes</button><button id="logout">Sign out</button></div></header><div class="workspace"><aside><p class="overline">MAKE IT YOURS</p><nav id="sections" aria-label="Editor sections"></nav><div class="aside-bottom"><button id="export">Download backup</button><label class="import-label">Restore backup<input id="import" type="file" accept="application/json" hidden></label></div></aside><main class="edit-main"><div id="edit-heading"></div><div id="fields"></div></main><section class="preview-panel" aria-label="Website preview"><div class="preview-toolbar"><span>LIVE PREVIEW</span><div><button id="desktop" aria-pressed="true">Desktop</button><button id="mobile" aria-pressed="false">Mobile</button></div></div><div class="preview-wrap"><iframe title="Website preview" id="preview" src="about:blank"></iframe></div><p>Edits appear here as you type. Save changes to update the website.</p></section></div></div><div id="toast" role="status"></div>
</body></html>
